<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI KPI Idea Generator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    textarea { width: 100%; height: 120px; }
    #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    button { margin-top: 10px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>AI KPI Idea Generator</h1>
  <p>輸入你嘅業務痛點，系統會隨機生成 KPI 建議，幫你啟發靈感。</p>
  
  <textarea id="inputText" placeholder="例如：我想自動化費用報銷流程"></textarea>
  <br>
  <button onclick="generateKPI()">Generate KPI Ideas</button>
  
  <div id="output"></div>

  <script>
    function generateKPI() {
      const input = document.getElementById("inputText").value.trim();
      const outputDiv = document.getElementById("output");
      
      if (!input) {
        outputDiv.innerHTML = "<em>請先輸入痛點。</em>";
        return;
      }
      
      // KPI 建議池
      const ideas = [
        "縮短流程時間 30%",
        "減少人工審批錯誤率至 5% 以下",
        "提升員工滿意度至 80%",
        "自動化覆蓋率達 70%",
        "降低運營成本 20%",
        "提升數據準確率至 95%",
        "加快審批速度至 1 天內完成",
        "提升跨部門協作效率 40%"
      ];
      
      // 隨機抽取 3 個 KPI 建議
      const shuffled = ideas.sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 3);
      
      let result = "<strong>痛點：</strong> " + input + "<br><br>";
      result += "<strong>建議 KPI：</strong><ul>";
      selected.forEach(kpi => {
        result += "<li>" + kpi + "</li>";
      });
      result += "</ul>";
      
      outputDiv.innerHTML = result;
    }
  </script>
</body>
</html>
