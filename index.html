<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI KPI Idea Generator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    textarea { width: 100%; height: 120px; }
    #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    button { margin-top: 10px; padding: 8px 16px; }
  </style>
</head>
<body>
  <h1>AI KPI Idea Generator</h1>
  <p>Type your business pain point below. The system will generate random KPI ideas to inspire you.</p>
  
  <textarea id="inputText" placeholder="e.g., I want to automate expense reimbursement"></textarea>
  <br>
  <button onclick="generateKPI()">Generate KPI Ideas</button>
  
  <div id="output"></div>

  <script>
    function generateKPI() {
      const input = document.getElementById("inputText").value.trim();
      const outputDiv = document.getElementById("output");
      
      if (!input) {
        outputDiv.innerHTML = "<em>Please enter a pain point first.</em>";
        return;
      }
      
      // KPI idea pool
      const ideas = [
        "Shorten process time by 30%",
        "Reduce manual approval errors below 5%",
        "Increase employee satisfaction to 80%",
        "Achieve 70% automation coverage",
        "Lower operating costs by 20%",
        "Improve data accuracy to 95%",
        "Complete approvals within 1 day",
        "Boost cross-department collaboration efficiency by 40%"
      ];
      
      // Randomly select 3 KPI ideas
      const shuffled = ideas.sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, 3);
      
      let result = "<strong>Pain Point:</strong> " + input + "<br><br>";
      result += "<strong>Suggested KPIs:</strong><ul>";
      selected.forEach(kpi => {
        result += "<li>" + kpi + "</li>";
      });
      result += "</ul>";
      
      outputDiv.innerHTML = result;
    }
  </script>
</body>
</html>
